<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>股價看板</title>
  <script src="https://unpkg.com/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    /* ===== ✏️ Demo 可以現場修改的顏色 =====
       存檔後重新整理預覽即可，不用重跑 fetch.py
       美股習慣「綠漲紅跌」：把 --up 和 --down 的色碼對調 */
    :root {
      --up: #e5484d;     /* 漲：台股紅 */
      --down: #30a46c;   /* 跌：台股綠 */
      --bg: #f7f7f8;     /* 頁面背景 */
      --card: #ffffff;   /* 卡片背景 */
      --text: #1c1c1e;   /* 主要文字 */
      --muted: #6e6e73;  /* 次要文字 */
    }
    /* ===================================== */
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text);
           font-family: system-ui, "Noto Sans TC", sans-serif; }
    main { max-width: 960px; margin: 0 auto; padding: 24px 16px; }
    .updated { color: var(--muted); font-size: 12px; margin: 0 0 8px; }
    h1 { margin: 0 0 4px; font-size: 28px; }
    .sub { color: var(--muted); margin: 0 0 20px; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
    .card { background: var(--card); border-radius: 12px; padding: 14px 16px; }
    .card .label { color: var(--muted); font-size: 13px; }
    .card .value { font-size: 24px; font-weight: 700; margin-top: 4px; font-variant-numeric: tabular-nums; }
    .up { color: var(--up); } .down { color: var(--down); }
    #chart { background: var(--card); border-radius: 12px; height: 420px; overflow: hidden; }
    .legend { color: var(--muted); font-size: 13px; margin: 8px 4px 16px; }
    table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 12px; overflow: hidden; font-variant-numeric: tabular-nums; }
    th, td { padding: 10px 12px; text-align: right; border-bottom: 1px solid var(--bg); }
    th:first-child, td:first-child { text-align: left; }
    th { color: var(--muted); font-weight: 500; font-size: 13px; }
    footer { color: var(--muted); font-size: 12px; margin-top: 20px; }
    @media (max-width: 600px) { .hide-sm { display: none; } }
  </style>
</head>
<body>
<main>
  <p class="updated" id="updated" hidden>網站更新：<time id="build-time"></time>（台灣時間）</p>
  <h1 id="title">股價看板</h1>
  <p class="sub" id="sub">載入中…</p>

  <div class="cards">
    <div class="card"><div class="label">收盤價</div><div class="value" id="close">-</div></div>
    <div class="card"><div class="label">區間漲跌</div><div class="value" id="range">-</div></div>
    <div class="card"><div class="label">區間高 / 低</div><div class="value" id="hilo">-</div></div>
  </div>

  <div id="chart"></div>
  <div class="legend" id="legend"></div>

  <table>
    <thead><tr><th>日期</th><th class="hide-sm">開</th><th class="hide-sm">高</th><th class="hide-sm">低</th><th>收</th><th>漲跌%</th><th>成交量(張)</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>

  <footer>資料來源：Yahoo Finance，由 GitHub Actions 自動部署。僅供展示，非投資建議。</footer>
</main>

<script>
// ===== ✏️ Demo 可以現場修改的設定 =====
const ROWS = 5;                                                  // 表格在區間裡均勻挑幾天
const MA_COLORS = ["#f5a524", "#3b82f6", "#a855f7", "#14b8a6"];  // 均線顏色，依 fetch.py 的 MA 順序
// =====================================

// 小工具：讀 CSS 變數、數字格式化、漲跌正負號與顏色
const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const fmt = (n, d = 2) => n == null ? "-" : n.toLocaleString("zh-TW", { minimumFractionDigits: d, maximumFractionDigits: d });
const sign = n => (n > 0 ? "+" : "") + fmt(n);
const cls = n => n > 0 ? "up" : n < 0 ? "down" : "";

// 時間由部署流程產生；本機預覽沒有此檔案時不顯示，也不影響股價載入。
fetch("build-info.json", { cache: "no-store" }).then(r => {
  if (!r.ok) throw new Error("沒有建置時間");
  return r.json();
}).then(({ built_at }) => {
  const date = new Date(built_at);
  if (Number.isNaN(date.getTime())) return;
  const time = document.getElementById("build-time");
  time.dateTime = built_at;
  time.textContent = new Intl.DateTimeFormat("zh-TW", {
    timeZone: "Asia/Taipei", year: "numeric", month: "2-digit", day: "2-digit",
    hour: "2-digit", minute: "2-digit", second: "2-digit", hourCycle: "h23",
  }).format(date);
  document.getElementById("updated").hidden = false;
}).catch(() => {});

// 讀 fetch.py 產生的 data.json（加時間參數避免瀏覽器快取舊資料）
fetch("data.json?t=" + Date.now()).then(r => r.json()).then(({ symbol, name, ma, rows }) => {
  const last = rows.at(-1), first = rows[0];
  const up = css("--up"), down = css("--down");

  // 標題
  document.title = `${name} ${symbol}`;
  document.getElementById("title").textContent = `${name}（${symbol.replace(".TW", "")}）`;
  document.getElementById("sub").textContent = `${first.Date} ～ ${last.Date}，共 ${rows.length} 個交易日`;

  // 上方三張卡片：收盤價、區間漲跌、區間高 / 低
  const set = (id, text, c = "") => { const el = document.getElementById(id); el.textContent = text; el.className = "value " + c; };
  // 區間漲跌 = 最後收盤 ÷ 區間第一天的前一日收盤
  const rangePct = (last.Close / (first.Close - first.Change) - 1) * 100;
  set("close", fmt(last.Close), cls(rangePct));   // 顏色跟著區間漲跌
  set("range", `${sign(rangePct)}%`, cls(rangePct));
  set("hilo", `${fmt(Math.max(...rows.map(r => r.High)), 0)} / ${fmt(Math.min(...rows.map(r => r.Low)), 0)}`);

  // 圖表：K 線 + 均線 + 成交量
  const el = document.getElementById("chart");
  const chart = LightweightCharts.createChart(el, {
    autoSize: true,
    layout: { background: { color: "transparent" }, textColor: css("--muted") },
    grid: { vertLines: { visible: false }, horzLines: { color: "#eee" } },
    timeScale: { borderVisible: false },
    rightPriceScale: { borderVisible: false, scaleMargins: { top: 0.08, bottom: 0.28 } },
  });
  chart.addCandlestickSeries({ upColor: up, downColor: down, borderVisible: false, wickUpColor: up, wickDownColor: down })
    .setData(rows.map(r => ({ time: r.Date, open: r.Open, high: r.High, low: r.Low, close: r.Close })));

  ma.forEach((n, i) => {
    chart.addLineSeries({ color: MA_COLORS[i % MA_COLORS.length], lineWidth: 2, priceLineVisible: false, lastValueVisible: false })
      .setData(rows.filter(r => r[`MA${n}`] != null).map(r => ({ time: r.Date, value: r[`MA${n}`] })));
  });

  const vol = chart.addHistogramSeries({ priceScaleId: "vol", priceFormat: { type: "volume" } });
  chart.priceScale("vol").applyOptions({ scaleMargins: { top: 0.8, bottom: 0 } });
  vol.setData(rows.map(r => ({ time: r.Date, value: r.Volume / 1000, color: (r.Change >= 0 ? up : down) + "66" })));
  // 視窗大小改變時，讓 K 線填滿寬度
  new ResizeObserver(() => chart.timeScale().fitContent()).observe(el);

  document.getElementById("legend").innerHTML = ma
    .map((n, i) => `<span style="color:${MA_COLORS[i % MA_COLORS.length]}">━</span> MA${n}`).join("　");

  // 表格：在區間裡均勻挑 ROWS 天（第一天、最後一天一定會在）
  const picks = [...new Set(Array.from({ length: ROWS }, (_, i) => Math.round(i * (rows.length - 1) / (ROWS - 1))))];
  document.getElementById("rows").innerHTML = picks.map(i => rows[i]).map(r => `
    <tr><td>${r.Date}</td>
      <td class="hide-sm">${fmt(r.Open)}</td><td class="hide-sm">${fmt(r.High)}</td><td class="hide-sm">${fmt(r.Low)}</td>
      <td class="${cls(r.Change)}">${fmt(r.Close)}</td>
      <td class="${cls(r.Change)}">${sign(r.ChangePct)}%</td>
      <td>${fmt(r.Volume / 1000, 0)}</td></tr>`).join("");
}).catch(err => {
  document.getElementById("sub").textContent = "資料載入失敗：" + err;
});
</script>
</body>
</html>
