name: 更新資料並部署網站

on:
  schedule:
    - cron: "17 6 * * 1-5"   # UTC 06:17 = 台灣 14:17，週一到週五收盤後
  workflow_dispatch:          # 可以在 Actions 頁籤手動按 Run workflow
  push:
    branches: [main]          # 合併 PR 後也會重新部署
    paths-ignore: ["**.md"]   # 只改 README 不重跑

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python fetch.py
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v5
