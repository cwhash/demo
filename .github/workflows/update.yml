name: 更新資料並部署網站

on:
  schedule:
    - cron: "17 6 * * 1-5"   # UTC 06:17 = 台灣 14:17，週一到週五收盤後
  workflow_dispatch:          # 可以在 Actions 頁籤手動按 Run workflow
  push:
    branches: [main]          # 合併 PR 後也會重抓並部署

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 抓資料
        run: python fetch.py

      - name: 資料有變才 commit
        run: |
          if git diff --quiet data.json; then
            echo "資料沒有變化，不 commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "data: $(TZ=Asia/Taipei date +%F)"
          git push

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v5
